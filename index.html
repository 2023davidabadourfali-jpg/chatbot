<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faro - El Bot Futbolero</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <!-- Encabezado del chat -->
    <header class="chat-header">
      <div class="bot-info">
        <span class="bot-avatar">⚽</span>
        <div>
          <h1>Faro</h1>
          <span class="status">En línea - El bot futbolero</span>
        </div>
      </div>
    </header>

    <!-- Zona de chat: Área donde se muestran los mensajes -->
    <main class="zona de chat" id="zona-de-chat">
      <!-- Los mensajes del bot y usuario se insertan dinámicamente aquí -->
    </main>

    <!-- Ingreso de opciones: Área para los botones de opciones o inputs requeridos -->
    <footer class="ingreso de opciones" id="ingreso-de-opciones">
      <!-- Los botones de opciones e inputs dinámicos se insertan aquí -->
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
